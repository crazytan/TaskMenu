name: TaskMenu
options:
  bundleIdPrefix: dev.crazytan
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "26.4"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  AppStore: release

configFiles:
  Debug: BuildConfig.xcconfig
  Release: BuildConfig.xcconfig
  AppStore: BuildConfig.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: "3"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    # Mac App Store builds compile out the GitHub update checker (guideline
    # 2.4.5(vii)) and the external donation link (guideline 3.1.1). Both stay
    # in Debug and Release, which feed the direct-download DMG.
    AppStore:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE_BUILD"

targets:
  TaskMenu:
    type: application
    platform: macOS
    sources:
      - path: TaskMenu
        excludes: ["README.md", "**/README.md"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crazytan.TaskMenu
        INFOPLIST_FILE: TaskMenu/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TaskMenu/Resources/TaskMenu.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_NAME: TaskMenu
        PROVISIONING_PROFILE_SPECIFIER: ""
    entitlements:
      path: TaskMenu/Resources/TaskMenu.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
  TaskMenuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TaskMenuTests
        excludes: ["README.md"]
    dependencies:
      - target: TaskMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crazytan.TaskMenuTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TaskMenu.app/Contents/MacOS/TaskMenu"

schemes:
  TaskMenu:
    build:
      preActions:
        - script: |
            "${SRCROOT}/scripts/stamp_build_metadata.sh" "${SRCROOT}"
          name: Stamp build metadata
          settingsTarget: TaskMenu
      targets:
        TaskMenu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TaskMenuTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Archive with this scheme for Mac App Store uploads; the TaskMenu scheme
  # archives the Developer ID build that the DMG release pipeline signs.
  TaskMenu (App Store):
    build:
      preActions:
        - script: |
            "${SRCROOT}/scripts/stamp_build_metadata.sh" "${SRCROOT}"
          name: Stamp build metadata
          settingsTarget: TaskMenu
      targets:
        TaskMenu: all
    run:
      config: AppStore
    test:
      config: Debug
      targets:
        - name: TaskMenuTests
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
