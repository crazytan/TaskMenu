name: TaskMenu
options:
  bundleIdPrefix: dev.crazytan
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "26.4"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  AppStore: release

configFiles:
  Debug: BuildConfig.xcconfig
  Release: BuildConfig.xcconfig
  AppStore: BuildConfig.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
    # Compiles out the update checker (guideline 2.4.5(vii)) and the donation
    # link (guideline 3.1.1); both stay in Debug and Release for the DMG.
    AppStore:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE_BUILD"

targets:
  TaskMenu:
    type: application
    platform: macOS
    sources:
      - path: TaskMenu
        excludes: ["README.md", "**/README.md"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crazytan.TaskMenu
        INFOPLIST_FILE: TaskMenu/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TaskMenu/Resources/TaskMenu.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_NAME: TaskMenu
        PROVISIONING_PROFILE_SPECIFIER: ""
        # macOS requires the team prefix on App Group ids; $(DEVELOPMENT_TEAM)
        # (not $(AppIdentifierPrefix)/$(TeamIdentifierPrefix), which only
        # expand with a provisioning profile present) resolves it at build
        # time. Runtime code treats an empty/unexpanded value as absent; see
        # SharedConstants.appGroupIdentifier / .keychainAccessGroup.
        APP_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).group.dev.crazytan.TaskMenu.shared"
        KEYCHAIN_ACCESS_GROUP: "$(DEVELOPMENT_TEAM).dev.crazytan.TaskMenu.shared"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(TASKMENU_DEVELOPER_ID_PROFILE)"
    entitlements:
      path: TaskMenu/Resources/TaskMenu.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - "$(DEVELOPMENT_TEAM).group.dev.crazytan.TaskMenu.shared"
        keychain-access-groups:
          - "$(DEVELOPMENT_TEAM).dev.crazytan.TaskMenu.shared"
    dependencies:
      - target: TaskMenuWidget
        embed: true
        codeSign: true
  TaskMenuWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TaskMenuWidget
        excludes: ["README.md"]
      - path: TaskMenu/WidgetSupport
        excludes: ["README.md"]
      - path: TaskMenu/Models/TaskItem.swift
      - path: TaskMenu/Models/TaskList.swift
      - path: TaskMenu/Models/TaskSortOrder.swift
      - path: TaskMenu/Models/TaskOrdering.swift
      - path: TaskMenu/Utilities/DateFormatting.swift
      - path: TaskMenu/Utilities/SharedConstants.swift
      - path: TaskMenu/Services/KeychainService.swift
      - path: TaskMenu/Services/TasksAPIProtocol.swift
      - path: TaskMenu/Services/GoogleTasksAPI.swift
      - path: TaskMenu/Services/AccessTokenProviding.swift
      - path: TaskMenu/Services/GoogleTokenRefresher.swift
      - path: TaskMenu/Services/WidgetGoogleAccessTokenProvider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crazytan.TaskMenu.Widget
        INFOPLIST_FILE: TaskMenuWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TaskMenuWidget/TaskMenuWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: TaskMenuWidget
        PROVISIONING_PROFILE_SPECIFIER: ""
        APP_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).group.dev.crazytan.TaskMenu.shared"
        KEYCHAIN_ACCESS_GROUP: "$(DEVELOPMENT_TEAM).dev.crazytan.TaskMenu.shared"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(TASKMENU_WIDGET_DEVELOPER_ID_PROFILE)"
    entitlements:
      path: TaskMenuWidget/TaskMenuWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - "$(DEVELOPMENT_TEAM).group.dev.crazytan.TaskMenu.shared"
        keychain-access-groups:
          - "$(DEVELOPMENT_TEAM).dev.crazytan.TaskMenu.shared"
  TaskMenuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TaskMenuTests
        excludes: ["README.md"]
    dependencies:
      - target: TaskMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crazytan.TaskMenuTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TaskMenu.app/Contents/MacOS/TaskMenu"

schemes:
  TaskMenu:
    build:
      preActions:
        - script: |
            "${SRCROOT}/scripts/stamp_build_metadata.sh" "${SRCROOT}"
          name: Stamp build metadata
          settingsTarget: TaskMenu
      targets:
        TaskMenu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TaskMenuTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Archive with this scheme for Mac App Store uploads.
  TaskMenu (App Store):
    build:
      preActions:
        - script: |
            "${SRCROOT}/scripts/stamp_build_metadata.sh" "${SRCROOT}"
          name: Stamp build metadata
          settingsTarget: TaskMenu
      targets:
        TaskMenu: all
    run:
      config: AppStore
    test:
      config: Debug
      targets:
        - name: TaskMenuTests
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
